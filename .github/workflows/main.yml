name: Note AI Agent

concurrency:
  group: note-agent
  cancel-in-progress: false

on:
  workflow_dispatch:

  schedule:
    - cron: '21 16 * * *'  # 日本時間 朝1:21

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai Markdown

      - name: Run Python script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python main_system/main.py

      - name: Upload Gemini response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-response
          path: gemini_response.txt
          if-no-files-found: ignore

      - name: Commit history and logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            combination_history.json \
            article_history.json \
            utils/ai_knowledge.json \
            logs/ \
            generated/

          git diff --cached --quiet || git commit -m "Update history and logs"

          git pull --rebase origin main

          git push